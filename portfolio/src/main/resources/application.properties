spring.application.name=portfolio

# Local development database: H2 in-memory. Swap to MySQL in prod by uncommenting the MySQL block below.
spring.datasource.url=jdbc:h2:mem:portfolio_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL configuration for local installation:
# spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_db
# spring.datasource.username=root
# spring.datasource.password=password@1234
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# NSE historical endpoint. Dates are generated for each scheduled run.
daily-price.api-url=https://www.nseindia.com/api/historicalOR/generateSecurityWiseHistoricalData?from={from}&to={to}&symbol={symbol}&type=priceVolumeDeliverable&series={series}&csv=true
daily-price.cron=0 0 16 * * MON-FRI
daily-price.zone=Asia/Kolkata


batch.historical-import.enabled=false
